services:
  - type: web
    name: traffic-church
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHURCH_NAME
        value: Grace Chapel International
      - key: PUBLIC_BASE_URL
        sync: false
