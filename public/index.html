<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Identity Command Center &bull; GCI Identity & Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HTML5-QRCode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      /* Backgrounds */
      --bg-main: #f4f5f7;
      --bg-sidebar: #090d16;
      --bg-panel: #ffffff;
      
      /* Stark borders & lines */
      --border-color: #d1d5db;
      --border-dark: #0b132b;
      --border-subtle: #e5e7eb;

      /* Typography */
      --text-main: #111827;
      --text-muted: #6b7280;
      --text-subtle: #9ca3af;
      --text-sidebar: #9ca3af;
      --text-sidebar-active: #ffffff;

      /* Command Accents */
      --brand-navy: #090d16;
      --brand-midnight: #0b132b;
      --accent-command: #1e3a8a;
      --accent-action: #2563eb;

      /* Operational Status Colors (Muted & Strict) */
      --status-active-bg: #d1fae5;
      --status-active-text: #065f46;
      --status-revoked-bg: #fee2e2;
      --status-revoked-text: #991b1b;
      --status-expired-bg: #fef3c7;
      --status-expired-text: #92400e;
      --status-suspended-bg: #ede9fe;
      --status-suspended-text: #5b21b6;
      --status-invalid-bg: #e2e8f0;
      --status-invalid-text: #334155;

      /* Monospace & Tabular Data Typography */
      --font-data: 'JetBrains Mono', 'Courier New', monospace;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --sidebar-width: 230px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Print Styles for Physical Badges */
    @media print {
      body * {
        visibility: hidden;
      }
      #printCardArea, #printCardArea * {
        visibility: visible;
      }
      #printCardArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: flex !important;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        background: #ffffff;
      }
      .no-print {
        display: none !important;
      }
    }

    /* App Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Military/Enterprise Sidebar (Command Menu) */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-right: 1px solid #1f2937;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #060910;
    }

    .org-badge-icon {
      width: 30px;
      height: 30px;
      background: #1e3a8a;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #ffffff;
      font-size: 12px;
      font-family: var(--font-data);
      flex-shrink: 0;
      border: 1px solid #3b82f6;
    }

    .org-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .org-subtitle {
      font-family: var(--font-data);
      font-size: 10px;
      color: #6b7280;
      margin-top: 2px;
    }

    .sidebar-nav {
      padding: 8px 0;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    /* Sharp Command Menu Items */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      color: var(--text-sidebar);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 0;
      border-left: 3px solid transparent;
      transition: background-color 0.1s ease, color 0.1s ease;
      cursor: pointer;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
      color: #ffffff;
    }

    .nav-item.active {
      background-color: #1f2937;
      color: var(--text-sidebar-active);
      border-left: 3px solid #ffffff;
      font-weight: 600;
    }

    .nav-item i {
      width: 16px;
      height: 16px;
      opacity: 0.85;
    }

    .sidebar-footer {
      padding: 12px 18px;
      border-top: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #060910;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 2px;
      background: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-data);
      color: #ffffff;
      border: 1px solid #374151;
    }

    /* Main Workspace */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-y: auto;
    }

    /* Clean Top Console Bar */
    .topbar {
      height: 50px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Utilitarian Command Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.1s ease;
      text-decoration: none;
      line-height: 1.2;
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .btn-primary:hover {
      background: #1e293b;
    }

    .btn-accent {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
    }

    .btn-accent:hover {
      background: #172554;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .btn-danger {
      background: var(--status-revoked-bg);
      color: var(--status-revoked-text);
      border-color: #fca5a5;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
    }

    /* Sharp, Monospaced Operational Status Badges */
    .status-badge, .badge {
      font-family: var(--font-data);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      white-space: nowrap;
    }

    .status-badge.active, .status-badge.verified, .badge.badge-verified, .badge.badge-active {
      background: var(--status-active-bg);
      color: var(--status-active-text);
      border: 1px solid #a7f3d0;
    }

    .status-badge.revoked, .badge.badge-revoked {
      background: var(--status-revoked-bg);
      color: var(--status-revoked-text);
      border: 1px solid #fecaca;
    }

    .status-badge.expired, .badge.badge-expired {
      background: var(--status-expired-bg);
      color: var(--status-expired-text);
      border: 1px solid #fde68a;
    }

    .status-badge.suspended, .badge.badge-suspended {
      background: var(--status-suspended-bg);
      color: var(--status-suspended-text);
      border: 1px solid #ddd6fe;
    }

    .status-badge.neutral, .status-badge.invalid, .badge.badge-neutral, .badge.badge-invalid {
      background: var(--status-invalid-bg);
      color: var(--status-invalid-text);
      border: 1px solid #cbd5e1;
    }

    /* Page Canvas */
    .page-container {
      padding: 24px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .page-header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .page-description {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Continuous Operational Metric Bar */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background-color: var(--border-color);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .stat-card {
      background-color: var(--bg-panel);
      padding: 14px 18px;
      border-radius: 0;
      box-shadow: none;
    }

    .stat-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-data);
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-family: var(--font-data);
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: none;
    }

    /* Unified Command Console Panel */
    .command-console-panel {
      border: 1px solid var(--border-color);
      background: #ffffff;
      border-radius: 2px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .console-panel-left {
      border-right: 1px solid var(--border-color);
      padding: 16px;
    }

    .console-panel-right {
      padding: 16px;
      background: #fafbfc;
    }

    .panel-heading {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-main);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Data Table (Sharp & Terminal-Aligned) */
    .table-container {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      overflow: hidden;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .data-table th {
      text-align: left;
      padding: 9px 12px;
      border-bottom: 2px solid var(--border-color);
      background-color: #f9fafb;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
      color: var(--text-main);
    }

    .data-table tr:hover td {
      background-color: #f9fafb;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .id-code {
      font-family: var(--font-data);
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #0f172a;
    }

    /* Forms */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #374151;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      font-size: 12.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--border-dark);
      box-shadow: 0 0 0 1px var(--border-dark);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    /* Card Simulator (CR80) */
    .cr80-card-wrapper {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 16px 0;
    }

    .cr80-card {
      width: 338px;
      height: 213px;
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', sans-serif;
    }

    .cr80-header {
      background: #090d16;
      color: #ffffff;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #d4af37;
    }

    .cr80-org-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .cr80-body {
      padding: 10px 12px;
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .cr80-photo {
      width: 76px;
      height: 92px;
      border-radius: 2px;
      object-fit: cover;
      border: 1px solid #94a3b8;
      background: #f1f5f9;
      flex-shrink: 0;
    }

    .cr80-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .cr80-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }

    .cr80-rank {
      font-size: 11px;
      font-weight: 700;
      color: #1e3a8a;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .cr80-dept {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cr80-id-badge {
      font-family: var(--font-data);
      font-size: 11px;
      font-weight: 700;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid #cbd5e1;
      display: inline-block;
      margin-top: 5px;
      width: fit-content;
      color: #0f172a;
    }

    .cr80-footer {
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 5px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--text-muted);
      font-family: var(--font-data);
      font-weight: 600;
    }

    .cr80-back-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
    }

    .cr80-qr-wrapper {
      background: #ffffff;
      padding: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 2px;
    }

    .cr80-qr-image {
      width: 86px;
      height: 86px;
      display: block;
    }

    .cr80-back-instruction {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.3;
      max-width: 250px;
    }

    /* Scanner Viewport */
    .scanner-container {
      max-width: 440px;
      margin: 0 auto;
    }

    #qrReader {
      width: 100% !important;
      border-radius: 2px !important;
      overflow: hidden !important;
      border: 1px solid #000000 !important;
      background: #000000;
    }

    /* Verification Result Card */
    .verification-result-card {
      max-width: 460px;
      margin: 16px auto;
      background: #ffffff;
      border-radius: 2px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .verif-banner {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
    }

    .verif-banner.verified { background: var(--status-active-text); }
    .verif-banner.revoked { background: var(--status-revoked-text); }
    .verif-banner.expired { background: var(--status-expired-text); }
    .verif-banner.suspended { background: var(--status-suspended-text); }
    .verif-banner.invalid { background: #374151; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(1px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-dialog {
      background: #ffffff;
      border-radius: 2px;
      border: 1px solid var(--border-color);
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fafb;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #f9fafb;
    }
  </style>
</head>
<body>

  <!-- Main Application Container -->
  <div id="appRoot"></div>

  <!-- Hidden Print Area for Physical Badges -->
  <div id="printCardArea" style="display: none;"></div>

  <script src="/app.js"></script>
</body>
</html>
